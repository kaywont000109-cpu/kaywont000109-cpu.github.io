<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>지각 벌칙 가챠</title>
  <style>
    * { box-sizing: border-box; font-family: 'Pretendard', 'Apple SD Gothic Neo', '맑은 고딕', sans-serif; }
    body { background-color: #eef2f7; margin: 0; padding: 25px 15px; display: flex; justify-content: center; align-items: center; min-height: 100vh; }
    
    .card { background: #ffffff; padding: 30px; border-radius: 24px; box-shadow: 0 12px 30px rgba(0,0,0,0.1); width: 100%; max-width: 850px; display: flex; flex-wrap: wrap; gap: 30px; }
    
    .title-banner { width: 100%; text-align: center; margin-bottom: 5px; }
    .title-banner h1 { margin: 0; color: #1e293b; font-size: 2.2rem; font-weight: 800; letter-spacing: -1px; }
    .title-banner p { margin: 6px 0 0 0; color: #64748b; font-size: 1rem; }

    /* 룰렛 영역 */
    .wheel-section { flex: 1.2; min-width: 300px; display: flex; flex-direction: column; align-items: center; }
    .wheel-box { position: relative; width: 320px; height: 320px; margin: 20px 0; }
    
    /* 포인터 (화살표) 커스텀: 더 크게 & 그림자 추가 */
    .pointer { 
      position: absolute; 
      top: -15px; 
      left: 50%; 
      transform: translateX(-50%); 
      width: 0; 
      height: 0; 
      border-left: 15px solid transparent; 
      border-right: 15px solid transparent; 
      border-top: 28px solid #ff3838; 
      z-index: 10;
      filter: drop-shadow(0 3px 3px rgba(0,0,0,0.3));
    }
    
    canvas { width: 100%; height: 100%; border-radius: 50%; border: 6px solid #ffffff; box-shadow: 0 6px 18px rgba(0,0,0,0.15); transition: transform 4s cubic-bezier(0.12, 0.8, 0.14, 1); }
    
    .spin-btn { 
      width: 100%;
      max-width: 280px;
      background: #3b82f6; 
      color: white; 
      border: none; 
      padding: 16px; 
      font-size: 1.3rem; 
      font-weight: 800; 
      border-radius: 16px; 
      cursor: pointer; 
      transition: all 0.2s ease; 
      box-shadow: 0 6px 16px rgba(59, 130, 246, 0.4); 
    }
    .spin-btn:hover { background: #2563eb; transform: translateY(-2px); }
    .spin-btn:disabled { background: #cbd5e1; cursor: not-allowed; transform: none; box-shadow: none; }
    
    /* 결과 창 강조 디자인 */
    .result-box { 
      margin-top: 20px; 
      width: 100%;
      padding: 15px; 
      border-radius: 12px;
      background-color: #f1f5f9;
      font-size: 1.3rem; 
      font-weight: 800; 
      color: #0f172a; 
      text-align: center; 
      min-height: 60px;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: all 0.3s ease;
    }
    .result-box.active {
      background-color: #fef2f2;
      color: #dc2626;
      border: 2px solid #fca5a5;
      transform: scale(1.02);
    }

    /* 설정 영역 */
    .settings-section { flex: 1; min-width: 280px; display: flex; flex-direction: column; background: #f8fafc; padding: 20px; border-radius: 16px; border: 1px solid #e2e8f0; }
    .section-title { font-size: 1.1rem; font-weight: 700; color: #334155; margin: 0 0 15px 0; display: flex; align-items: center; justify-content: space-between; }
    
    .input-container { display: flex; flex-direction: column; gap: 8px; margin-bottom: 20px; }
    .input-row { display: flex; gap: 8px; }
    
    .input-field { border: 2px solid #cbd5e1; padding: 12px; border-radius: 10px; font-size: 1rem; outline: none; transition: 0.2s; }
    .input-field:focus { border-color: #3b82f6; }
    .input-name { flex: 3; }
    .input-weight { flex: 1.5; text-align: center; }

    .add-btn { background: #10b981; color: white; border: none; padding: 12px; border-radius: 10px; cursor: pointer; font-weight: 700; font-size: 1rem; transition: 0.2s; }
    .add-btn:hover { background: #059669; }

    .item-list { list-style: none; padding: 0; margin: 0; max-height: 280px; overflow-y: auto; }
    .item-card { display: flex; justify-content: space-between; align-items: center; padding: 12px; background: white; border-radius: 10px; margin-bottom: 8px; font-size: 1rem; font-weight: 600; border: 1px solid #e2e8f0; }
    .item-info { display: flex; gap: 10px; align-items: center; }
    .color-tag { width: 16px; height: 16px; border-radius: 4px; display: inline-block; flex-shrink: 0; }
    .percent-badge { font-size: 0.85rem; color: #64748b; background: #f1f5f9; padding: 3px 8px; border-radius: 6px; }
    
    .delete-btn { background: #ef4444; color: white; border: none; padding: 6px 10px; border-radius: 6px; cursor: pointer; font-size: 0.85rem; font-weight: 700; }
    .delete-btn:hover { background: #dc2626; }
    
    .input-label { font-size: 0.85rem; font-weight: 700; color: #64748b; margin-bottom: 2px; }
  </style>
</head>
<body>

<div class="card">
  <div class="title-banner">
    <h1>🎯 지각 벌칙 가챠</h1>
    <p>버튼을 눌러 룰렛을 돌려주세요!</p>
  </div>
  
  <div class="wheel-section">
    <div class="wheel-box">
      <div class="pointer"></div>
      <!-- 고해상도 캔버스 지정 -->
      <canvas id="roulette" width="400" height="400"></canvas>
    </div>
    <button class="spin-btn" id="spinBtn" onclick="spin()">🎰 룰렛 돌리기</button>
    <div class="result-box" id="resultBox">결과가 여기에 표시됩니다</div>
  </div>

  <div class="settings-section">
    <div class="section-title">
      <span>⚙️ 벌칙 항목 수정</span>
    </div>
    
    <div class="input-container">
      <div style="display: flex; gap: 8px;">
        <div style="flex:3;">
          <div class="input-label">벌칙 이름</div>
          <input type="text" id="itemName" class="input-field input-name" placeholder="예: 청소 1회" style="width:100%;">
        </div>
        <div style="flex:1.5;">
          <div class="input-label">비율(가중치)</div>
          <input type="number" id="itemWeight" class="input-field input-weight" value="10" min="1" style="width:100%;">
        </div>
      </div>
      <button class="add-btn" onclick="addItem()">+ 항목 추가하기</button>
    </div>

    <ul class="item-list" id="itemList"></ul>
  </div>
</div>

<script>
  // 선명하고 대비가 강한 고대비 컬러 파스텔 조합
  const colors = ['#ff5252', '#3498db', '#2ecc71', '#f1c40f', '#9b59b6', '#e67e22', '#1abc9c', '#e84393'];
  
  let items = [
    { name: '쓰레기통지기 흑기사 1회', weight: 25 },
    { name: '청소 대신맨 1회', weight: 50 },
    { name: '청소 대신맨 2회', weight: 25 }
  ];

  const canvas = document.getElementById('roulette');
  const ctx = canvas.getContext('2d');
  let currentRotation = 0;

  function drawWheel() {
    const totalWeight = items.reduce((sum, item) => sum + Number(item.weight), 0);
    ctx.clearRect(0, 0, canvas.width, canvas.height);

    if (totalWeight === 0) return;

    let startAngle = -Math.PI / 2; // 12시 방향 시작
    const centerX = canvas.width / 2;
    const centerY = canvas.height / 2;
    const radius = centerX;

    items.forEach((item, index) => {
      const sliceAngle = (item.weight / totalWeight) * 2 * Math.PI;
      const color = colors[index % colors.length];

      // 조각 그리기
      ctx.beginPath();
      ctx.moveTo(centerX, centerY);
      ctx.arc(centerX, centerY, radius, startAngle, startAngle + sliceAngle);
      ctx.closePath();
      ctx.fillStyle = color;
      ctx.fill();

      // 구분선 그리기 (직관성 강화)
      ctx.lineWidth = 2;
      ctx.strokeStyle = "#ffffff";
      ctx.stroke();

      // 텍스트 그리기 (가독성 최적화: 흰색 글씨 + 검은색 테두리 외곽선)
      ctx.save();
      ctx.translate(centerX, centerY);
      ctx.rotate(startAngle + sliceAngle / 2);
      ctx.textAlign = "right";
      ctx.textBaseline = "middle";

      // 글자 크기 선명하게 확대
      ctx.font = "bold 18px Pretendard, sans-serif";
      
      // 글자 검은 테두리 (가독성 핵심)
      ctx.strokeStyle = "rgba(0, 0, 0, 0.7)";
      ctx.lineWidth = 4;
      ctx.strokeText(item.name, radius - 25, 0);

      // 글자 내부 채우기
      ctx.fillStyle = "#ffffff";
      ctx.fillText(item.name, radius - 25, 0);

      ctx.restore();

      startAngle += sliceAngle;
    });

    renderList();
  }

  function renderList() {
    const listEl = document.getElementById('itemList');
    const totalWeight = items.reduce((sum, item) => sum + Number(item.weight), 0);
    listEl.innerHTML = '';

    items.forEach((item, index) => {
      const percent = totalWeight > 0 ? ((item.weight / totalWeight) * 100).toFixed(0) : 0;
      const li = document.createElement('li');
      li.className = 'item-card';
      li.innerHTML = `
        <div class="item-info">
          <span class="color-tag" style="background:${colors[index % colors.length]}"></span>
          <span>${item.name}</span>
          <span class="percent-badge">${percent}%</span>
        </div>
        <button class="delete-btn" onclick="removeItem(${index})">삭제</button>
      `;
      listEl.appendChild(li);
    });
  }

  function addItem() {
    const nameInput = document.getElementById('itemName');
    const weightInput = document.getElementById('itemWeight');

    if (!nameInput.value.trim() || !weightInput.value || weightInput.value <= 0) {
      alert('올바른 벌칙 이름과 비율을 입력해 주세요.');
      return;
    }

    items.push({ name: nameInput.value.trim(), weight: Number(weightInput.value) });
    nameInput.value = '';
    weightInput.value = '10';
    drawWheel();
  }

  function removeItem(index) {
    if (items.length <= 1) {
      alert('최소 1개 이상의 벌칙이 등록되어 있어야 합니다.');
      return;
    }
    items.splice(index, 1);
    drawWheel();
  }

  function spin() {
    if (items.length === 0) return;

    const spinBtn = document.getElementById('spinBtn');
    const resultBox = document.getElementById('resultBox');
    
    spinBtn.disabled = true;
    resultBox.classList.remove('active');
    resultBox.innerText = '두구두구두구... 🥁';

    const totalWeight = items.reduce((sum, item) => sum + Number(item.weight), 0);
    let randomNum = Math.random() * totalWeight;
    let selectedIndex = 0;

    for (let i = 0; i < items.length; i++) {
      if (randomNum < items[i].weight) {
        selectedIndex = i;
        break;
      }
      randomNum -= items[i].weight;
    }

    // 각도 정확도 계산
    let accumulatedWeight = 0;
    for (let i = 0; i < selectedIndex; i++) {
      accumulatedWeight += items[i].weight;
    }
    const winnerMiddleWeight = accumulatedWeight + (items[selectedIndex].weight / 2);
    const targetAngleDegree = (winnerMiddleWeight / totalWeight) * 360;

    // 회전 계산 (5바퀴 회전 후 해당 위치에 정지)
    const rotateTo = 360 * 5 - targetAngleDegree;
    currentRotation += (rotateTo - (currentRotation % 360));

    canvas.style.transform = `rotate(${currentRotation}deg)`;

    // 결과 출력 (4초 뒤 애니메이션 완료 시점)
    setTimeout(() => {
      resultBox.innerText = `🎉 당첨: [ ${items[selectedIndex].name} ]`;
      resultBox.classList.add('active');
      spinBtn.disabled = false;
    }, 4000);
  }

  // 초기 렌더링
  drawWheel();
</script>
</body>
</html>
