<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pistachio Memo OS</title>
    <link href="https://cdn.jsdelivr.net/npm/galmuri@latest/dist/galmuri.css" rel="stylesheet">
    <style>
        :root {
            --bg-color: #f4f9f1;
            --point-color: #b5c99a;
            --point-hover: #97a97f;
            --text-main: #4a5c40;
            --text-light: #718365;
            --white: #ffffff;
            --window-border: #e0e7d9;
            --danger-color: #e07a5f;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Galmuri9', 'Pretendard', 'Malgun Gothic', sans-serif;
        }

        body {
            background-color: transparent;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
        }

        .os-window {
            width: 100%;
            max-width: 620px;
            height: 95vh;
            background-color: var(--white);
            border: 2px solid var(--window-border);
            border-radius: 12px;
            display: flex;
            flex-direction: row;
            box-shadow: 0 4px 20px rgba(181, 201, 154, 0.2);
            overflow: hidden;
        }

        .sidebar {
            width: 125px;
            background-color: var(--bg-color);
            border-right: 2px solid var(--window-border);
            padding: 15px 8px;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
        }

        .folder-list {
            display: flex;
            flex-direction: column;
            gap: 10px;
        }

        .folder {
            display: flex;
            flex-direction: column;
            align-items: center;
            cursor: pointer;
            color: var(--text-light);
            font-size: 11px;
            transition: 0.2s;
            padding: 8px 0;
            border-radius: 8px;
        }

        .folder:hover, .folder.active {
            background-color: var(--point-color);
            color: var(--white);
        }

        .folder-icon {
            font-size: 20px;
            margin-bottom: 3px;
        }

        .reset-btn {
            background: transparent;
            border: 1px dashed var(--text-light);
            color: var(--text-light);
            border-radius: 6px;
            padding: 6px 0;
            font-size: 10px;
            cursor: pointer;
            transition: 0.2s;
        }

        .reset-btn:hover {
            border-color: var(--danger-color);
            color: var(--danger-color);
        }

        .chat-container {
            flex: 1;
            display: flex;
            flex-direction: column;
            background-color: #fafdf8;
            position: relative;
        }

        .chat-history {
            flex: 1;
            padding: 20px;
            overflow-y: auto;
            display: flex;
            flex-direction: column;
            gap: 15px;
        }

        .bubble-wrapper {
            display: flex;
            flex-direction: column;
            align-items: flex-end;
            position: relative;
        }

        .bubble-tag {
            font-size: 10px;
            color: var(--text-light);
            margin-bottom: 4px;
            display: flex;
            gap: 6px;
            align-items: center;
        }

        .bubble-actions {
            display: flex;
            gap: 4px;
            font-size: 12px;
        }

        .action-btn {
            filter: grayscale(100%);
            transition: 0.2s;
            cursor: pointer;
        }

        .action-btn.pin-btn { opacity: 0.2; }
        .action-btn.heart-btn, .action-btn.reply-btn { opacity: 0.55; }

        .action-btn:hover {
            opacity: 0.85;
            transform: scale(1.15);
        }

        .action-btn.active {
            opacity: 1 !important;
            filter: grayscale(0%) !important;
        }

        .bubble {
            background-color: var(--point-color);
            color: var(--white);
            padding: 12px 16px;
            border-radius: 16px;
            border-bottom-right-radius: 4px;
            max-width: 85%;
            font-size: 14px;
            line-height: 1.4;
            word-break: break-all;
            box-shadow: 0 2px 5px rgba(0,0,0,0.05);
            position: relative;
        }

        .bubble-wrapper.pinned .bubble {
            background-color: #8fbc8f;
            border: 2px solid #556b2f;
        }

        .reply-quote {
            background-color: rgba(255, 255, 255, 0.35);
            border-left: 3px solid #ffffff;
            padding: 4px 8px;
            font-size: 11px;
            border-radius: 4px;
            margin-bottom: 6px;
            color: #f0f0f0;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .input-container {
            border-top: 2px solid var(--window-border);
            background-color: var(--white);
        }

        .reply-bar {
            background-color: var(--bg-color);
            padding: 6px 15px;
            font-size: 11px;
            color: var(--text-main);
            display: none;
            justify-content: space-between;
            align-items: center;
            border-bottom: 1px solid var(--window-border);
        }

        .reply-bar .cancel-reply {
            cursor: pointer;
            color: var(--danger-color);
            font-weight: bold;
        }

        .input-area {
            height: 60px;
            display: flex;
            align-items: center;
            padding: 0 15px;
            gap: 10px;
        }

        .input-box {
            flex: 1;
            height: 40px;
            border: 2px solid var(--window-border);
            border-radius: 20px;
            padding: 0 15px;
            font-size: 14px;
            outline: none;
            color: var(--text-main);
            background-color: var(--bg-color);
        }

        .input-box:focus {
            border-color: var(--point-color);
        }

        .send-btn {
            background-color: var(--point-color);
            color: var(--white);
            border: none;
            border-radius: 20px;
            padding: 0 20px;
            height: 40px;
            cursor: pointer;
            font-weight: bold;
            font-size: 12px;
            transition: 0.2s;
        }

        .send-btn:hover {
            background-color: var(--point-hover);
        }

        ::-webkit-scrollbar { width: 8px; }
        ::-webkit-scrollbar-track { background: var(--bg-color); }
        ::-webkit-scrollbar-thumb { background: var(--point-color); border-radius: 4px; }
    </style>
</head>
<body>

<div class="os-window">
    <div class="sidebar">
        <div class="folder-list">
            <div class="folder active" data-category="ALL" onclick="changeCategory('ALL')">
                <span class="folder-icon">📁</span>
                <span>ALL</span>
            </div>
            <div class="folder" data-category="FAVORITE" onclick="changeCategory('FAVORITE')">
                <span class="folder-icon">❤️</span>
                <span>즐겨찾기</span>
            </div>
            <div class="folder" data-category="Brain Dump" onclick="changeCategory('Brain Dump')">
                <span class="folder-icon">🧠</span>
                <span>Brain Dump</span>
            </div>
            <div class="folder" data-category="Little Wins" onclick="changeCategory('Little Wins')">
                <span class="folder-icon">🏆</span>
                <span>Little Wins</span>
            </div>
            <div class="folder" data-category="일상 한 조각" onclick="changeCategory('일상 한 조각')">
                <span class="folder-icon">🌿</span>
                <span>일상 한 조각</span>
            </div>
        </div>
        <button class="reset-btn" id="clearBtn" onclick="clearMemos()">CLEAR</button>
    </div>

    <div class="chat-container">
        <div class="chat-history" id="chatHistory"></div>

        <div class="input-container">
            <div class="reply-bar" id="replyBar">
                <span id="replyTextPreview">↳ 답장 선택됨</span>
                <span class="cancel-reply" onclick="cancelReply()">✕ 취소</span>
            </div>
            <div class="input-area">
                <input type="text" id="memoInput" class="input-box" placeholder="메모를 빠르게 적어보세요..." onkeypress="handleEnter(event)">
                <button class="send-btn" onclick="sendMemo()">SEND</button>
            </div>
        </div>
    </div>
</div>

<script>
    const defaultMemos = [
        { id: 1, category: 'Brain Dump', text: '노션 대시보드 폰트는 픽셀로 설정하기', isHeart: true, isPinned: true, parentText: null },
        { id: 2, category: 'Little Wins', text: '오늘 아침 7시 기상 성공! 💪', isHeart: false, isPinned: false, parentText: null },
        { id: 3, category: '일상 한 조각', text: '점심에 먹은 피스타치오 젤라또 최고였다.', isHeart: true, isPinned: false, parentText: null }
    ];

    let memos = JSON.parse(localStorage.getItem('pistachio_memos_v3')) || defaultMemos;
    let currentCategory = 'ALL';
    let replyTargetMemo = null;
    let isClearConfirming = false;

    function saveMemosToStorage() {
        localStorage.setItem('pistachio_memos_v3', JSON.stringify(memos));
    }

    function renderMemos() {
        const history = document.getElementById('chatHistory');
        history.innerHTML = '';

        let filteredMemos;
        if (currentCategory === 'FAVORITE') {
            filteredMemos = memos.filter(memo => memo.isHeart);
        } else if (currentCategory === 'ALL') {
            filteredMemos = [...memos];
        } else {
            filteredMemos = memos.filter(memo => memo.category === currentCategory);
        }

        filteredMemos.sort((a, b) => (b.isPinned ? 1 : 0) - (a.isPinned ? 1 : 0));

        filteredMemos.forEach(memo => {
            const wrapper = document.createElement('div');
            wrapper.className = `bubble-wrapper ${memo.isPinned ? 'pinned' : ''}`;

            const tag = document.createElement('div');
            tag.className = 'bubble-tag';
            
            tag.innerHTML = `
                <div class="bubble-actions">
                    <span class="action-btn pin-btn ${memo.isPinned ? 'active' : ''}" title="고정하기" onclick="togglePin(${memo.id})">📌</span>
                    <span class="action-btn heart-btn ${memo.isHeart ? 'active' : ''}" title="즐겨찾기" onclick="toggleHeart(${memo.id})">${memo.isHeart ? '❤️' : '🤍'}</span>
                    <span class="action-btn reply-btn" title="메모 엮기(답장)" onclick="setReplyTarget(${memo.id})">💬</span>
                </div>
                <span>[${memo.category}]</span>
            `;

            const bubble = document.createElement('div');
            bubble.className = 'bubble';
            
            let innerHTMLContent = '';
            if (memo.parentText) {
                innerHTMLContent += `<div class="reply-quote">↳ ${escapeHtml(memo.parentText)}</div>`;
            }
            innerHTMLContent += escapeHtml(memo.text);
            bubble.innerHTML = innerHTMLContent;

            wrapper.appendChild(tag);
            wrapper.appendChild(bubble);
            history.appendChild(wrapper);
        });

        history.scrollTop = history.scrollHeight;
    }

    function escapeHtml(text) {
        return text.replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;");
    }

    function togglePin(id) {
        memos = memos.map(m => m.id === id ? { ...m, isPinned: !m.isPinned } : m);
        saveMemosToStorage();
        renderMemos();
    }

    function toggleHeart(id) {
        memos = memos.map(m => m.id === id ? { ...m, isHeart: !m.isHeart } : m);
        saveMemosToStorage();
        renderMemos();
    }

    function setReplyTarget(id) {
        const target = memos.find(m => m.id === id);
        if (!target) return;
        
        replyTargetMemo = target;
        document.getElementById('replyTextPreview').innerText = `↳ [엮음] "${target.text.substring(0, 18)}..." 메모에 덧붙이는 중`;
        document.getElementById('replyBar').style.display = 'flex';
        document.getElementById('memoInput').focus();
    }

    function cancelReply() {
        replyTargetMemo = null;
        document.getElementById('replyBar').style.display = 'none';
    }

    function changeCategory(category) {
        currentCategory = category;
        document.querySelectorAll('.folder').forEach(el => {
            el.classList.remove('active');
            if(el.getAttribute('data-category') === category) el.classList.add('active');
        });
        renderMemos();
    }

    function handleEnter(event) {
        if (event.key === 'Enter') sendMemo();
    }

    async function sendMemo() {
        const input = document.getElementById('memoInput');
        const text = input.value.trim();

        if (text === '') return;

        const categoryToSave = (currentCategory === 'ALL' || currentCategory === 'FAVORITE') ? 'Brain Dump' : currentCategory;
        const webhookUrl = "https://hook.eu1.make.com/csrm75uyzwdm10ngxufdx4ef4jko37im";

        const newMemo = {
            id: Date.now(),
            category: categoryToSave,
            text: text,
            isHeart: false,
            isPinned: false,
            parentText: replyTargetMemo ? replyTargetMemo.text : null
        };

        memos.push(newMemo);
        saveMemosToStorage();

        input.value = '';
        cancelReply();
        renderMemos();

        try {
            await fetch(webhookUrl, {
                method: "POST",
                headers: { "Content-Type": "application/json" },
                body: JSON.stringify({
                    text: text,
                    category: categoryToSave,
                    parentText: newMemo.parentText || ""
                })
            });
        } catch (error) {
            console.error("전송 에러:", error);
        }
    }

    // 💡 초기 예시 문장까지 완전하게 지우는 전체 삭제 로직
    function clearMemos() {
        const btn = document.getElementById('clearBtn');
        if (!isClearConfirming) {
            isClearConfirming = true;
            btn.innerText = "SURE?";
            btn.style.color = "var(--danger-color)";
            btn.style.borderColor = "var(--danger-color)";
            
            setTimeout(() => {
                isClearConfirming = false;
                btn.innerText = "CLEAR";
                btn.style.color = "var(--text-light)";
                btn.style.borderColor = "var(--text-light)";
            }, 3000);
        } else {
            // 예시 문장을 포함한 모든 메모를 완전 삭제 (빈 배열)
            memos = [];
            saveMemosToStorage();
            renderMemos();

            isClearConfirming = false;
            btn.innerText = "CLEAR";
            btn.style.color = "var(--text-light)";
            btn.style.borderColor = "var(--text-light)";
        }
    }

    renderMemos();
</script>

</body>
</html>
